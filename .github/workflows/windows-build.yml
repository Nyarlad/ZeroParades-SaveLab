name: Windows portable build (no publication)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/audit_release.py --output artifacts/source-audit.json
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: ZeroParades-SaveLab-windows-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/build-report.json
            artifacts/source-audit.json
          if-no-files-found: error
          retention-days: 14
